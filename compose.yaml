services:
    # Front - react
    frontend:
        build: ./frontend/
        ports:
            - "3001:80"
        depends_on:
            - backend
        networks:
            - app_network
    # Back - laravel, php
    backend:
        build: ./backend/
        env_file:
            - ./.env
        ports:
            - "8000:8000"
        networks:
            - app_network
        depends_on:
            db:
                condition: service_healthy
    # MYSQL
    db:
        image: mysql:8.0
        volumes:
            - mysql_data:/var/lib/mysql
        environment:
            MYSQL_DATABASE: fitness_web_app
            MYSQL_USER: fitness
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        networks:
            - app_network
        healthcheck:
            test: ["CMD","mysqladmin","ping","-h","localhost","-u","root"]
            interval: 10s
            timeout: 5s
            retries: 5
volumes:
    mysql_data:
networks:
    app_network:
        driver: bridge
